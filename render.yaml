services:
  - type: web
    name: messger-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: messger-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://secret-messenger-sepia-xi.vercel.app
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: ^https://.*\.vercel\.app$
      - key: DB_ENGINE
        value: sqlite3